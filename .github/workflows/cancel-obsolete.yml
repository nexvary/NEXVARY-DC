name: Cancel obsolete validation
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, branch: 'main', per_page: 30 });
            for (const run of runs.data.workflow_runs) {
              if (run.name === 'Build and verify' && run.head_sha !== context.sha && run.status !== 'completed') {
                try {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', { ...context.repo, run_id: run.id });
                } catch (error) {
                  if (![409, 422].includes(error.status)) throw error;
                }
              }
            }

name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: disk-care-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler unavailable" }
          & $compiler packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-DC-Windows-0.1.0
          path: out/
          if-no-files-found: error

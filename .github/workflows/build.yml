name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: disk-care-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cancel-stale:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const current = Number(process.env.GITHUB_RUN_ID);
            const runs = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, branch, per_page: 30 });
            for (const run of runs.data.workflow_runs) {
              if (run.id < current && run.name === 'Build and verify' && run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 cmake libgtk-3-dev libusb-dev libconfig-dev gettext xxd pkg-config
      - name: Qualify pinned OpenSuperClone source without disk access
        if: runner.os == 'Linux'
        run: python3 scripts/qualify_opensuperclone.py --output out/osc-qualification
      - name: Retain OpenSuperClone qualification and corresponding source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: OpenSuperClone-qualification-0.7.0
          path: |
            out/osc-qualification/qualification.json
            out/osc-qualification/help.txt
            out/osc-qualification/LICENSE
            out/osc-qualification/upstream-source.tar.gz
          if-no-files-found: error
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Parse all PowerShell sources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed=@()
          Get-ChildItem scripts,tests,packaging -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){$errors | Format-List | Out-String | Write-Host;$failed+=$_.FullName}
          }
          if($failed.Count){throw ('PowerShell parse failures: '+($failed -join ', '))}
      - name: Boot repair safety tests
        run: python -m unittest discover -s tests/boot -v
      - name: Direct transport and relay safety tests
        run: python -m unittest discover -s tests/direct -v
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Capture recovery and boot UI
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p out/ui
          build/nexvary_dc --page 2 --selective-retry --screenshot out/ui/selective-ar.png
          build/nexvary_dc --page 2 --selective-retry --english --screenshot out/ui/selective-en.png
          build/nexvary_dc --page 2 --screenshot out/ui/recovery-ar.png
          build/nexvary_dc --page 8 --boot-repair --compact --screenshot out/ui/repair-ar.png
          build/nexvary_dc --page 8 --boot-repair --english --compact --screenshot out/ui/repair-en.png
          build/nexvary_dc --page 8 --screenshot out/ui/boot-ar.png
          build/nexvary_dc --page 8 --english --compact --screenshot out/ui/boot-en-compact.png
          python3 -c "import base64,pathlib; print('DC_UI_PNG='+base64.b64encode(pathlib.Path('out/ui/recovery-ar.png').read_bytes()).decode())"
      - name: Upload UI proof
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-DC-UI-0.7.0
          path: out/ui/
          if-no-files-found: error
      - name: Capture Windows boot repair UI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_QUICK_BACKEND: software
        run: |
          New-Item -ItemType Directory -Force out/ui-windows | Out-Null
          foreach($language in @('ar','en')) {
            $arguments=@('--font-proof','--page','8','--boot-repair','--compact','--screenshot',"out/ui-windows/repair-$language.png")
            if($language -eq 'en') {$arguments+='--english'}
            $p=Start-Process build/Release/nexvary_dc.exe -ArgumentList $arguments -PassThru
            if(!$p.WaitForExit(45000)) {$p.Kill();throw 'Repair UI screenshot timeout'}
            if($p.ExitCode -ne 0) {throw 'Repair UI screenshot failed'}
          }
          foreach($language in @('ar','en')) {
            $arguments=@('--font-proof','--page','2','--selective-retry','--screenshot',"out/ui-windows/selective-$language.png")
            if($language -eq 'en') {$arguments+='--english'}
            $p=Start-Process build/Release/nexvary_dc.exe -ArgumentList $arguments -PassThru
            if(!$p.WaitForExit(45000)) {$p.Kill();throw 'Selective retry UI screenshot timeout'}
            if($p.ExitCode -ne 0) {throw 'Selective retry UI screenshot failed'}
          }
          python -c "import base64,pathlib; print('DC_WINDOWS_SELECTIVE_PNG='+base64.b64encode(pathlib.Path('out/ui-windows/selective-ar.png').read_bytes()).decode())"
          python -c "import base64,pathlib; print('DC_WINDOWS_REPAIR_PNG='+base64.b64encode(pathlib.Path('out/ui-windows/repair-ar.png').read_bytes()).decode())"
      - name: Upload Windows repair UI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-DC-Windows-Repair-UI-0.7.0
          path: out/ui-windows/
          if-no-files-found: error
      - name: Deploy Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Test portable deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smart = (Resolve-Path out/portable/engines/smartctl.exe).Path
          & $smart --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled SMART unavailable" }
          $savedPath = $env:PATH
          $savedPlugins = $env:QT_PLUGIN_PATH
          $savedImports = $env:QML2_IMPORT_PATH
          try {
            $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot;$env:SystemRoot/System32/WindowsPowerShell/v1.0"
            $env:QT_PLUGIN_PATH = ""
            $env:QML2_IMPORT_PATH = ""
            $env:QT_QPA_PLATFORM = "offscreen"
            $env:QT_QUICK_BACKEND = "software"
            $exe = (Resolve-Path out/portable/nexvary_dc.exe).Path
            $proc = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (!$proc.WaitForExit(45000)) { $proc.Kill(); throw "Portable startup timed out" }
            if ($proc.ExitCode -ne 0) { throw "Portable startup failed: $($proc.ExitCode)" }
          } finally {
            $env:PATH = $savedPath
            $env:QT_PLUGIN_PATH = $savedPlugins
            $env:QML2_IMPORT_PATH = $savedImports
          }
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler unavailable" }
          & $compiler packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Verify installer and uninstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'NEXVARY-DC-installed-test'
          $setup = (Resolve-Path out/NEXVARY-DC-0.7.0-Setup.exe).Path
          $install = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',"/DIR=$destination") -PassThru
          if (!$install.WaitForExit(60000)) { $install.Kill(); throw "Installer timeout" }
          if ($install.ExitCode -ne 0) { throw "Installation failed: $($install.ExitCode)" }
          $exe = Join-Path $destination 'nexvary_dc.exe'
          if (!(Test-Path $exe)) { throw "Installed executable missing" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $app = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
          if (!$app.WaitForExit(45000)) { $app.Kill(); throw "Installed startup timeout" }
          if ($app.ExitCode -ne 0) { throw "Installed startup failed: $($app.ExitCode)" }
          $remove = Start-Process (Join-Path $destination 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
          if (!$remove.WaitForExit(60000)) { $remove.Kill(); throw "Uninstaller timeout" }
          if ($remove.ExitCode -ne 0 -or (Test-Path $exe)) { throw "Uninstall verification failed" }
      - name: Assemble downloadable release and checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path out/portable/* -DestinationPath out/NEXVARY-DC-0.7.0-Portable.zip
          $files=@('out/NEXVARY-DC-0.7.0-Setup.exe','out/NEXVARY-DC-0.7.0-Portable.zip')
          $manifest=@{version='0.7.0';commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;files=@()}
          foreach($path in $files){$item=Get-Item $path;$hash=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant();$manifest.files+=@{name=$item.Name;bytes=$item.Length;sha256=$hash}}
          $manifest | ConvertTo-Json -Depth 5 | Set-Content out/release-manifest.json -Encoding utf8
          $manifest.files | ForEach-Object {"$($_.sha256)  $($_.name)"} | Set-Content out/SHA256SUMS.txt -Encoding ascii
          Get-Content out/release-manifest.json
      - name: Upload release files
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-DC-Release-0.7.0
          path: |
            out/NEXVARY-DC-0.7.0-Setup.exe
            out/NEXVARY-DC-0.7.0-Portable.zip
            out/release-manifest.json
            out/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-DC-Installer-0.7.0
          path: out/NEXVARY-DC-0.7.0-Setup.exe
          if-no-files-found: error
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-DC-Portable-0.7.0
          path: out/portable/
          if-no-files-found: error

  linux-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual firmware test tools
        run: |
          sudo apt-get update
          dc_kernel_package=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/{print $2; exit}')
          test -n "$dc_kernel_package"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf tesseract-ocr grub-pc-bin grub-efi-amd64-bin grub2-common efibootmgr busybox-static "$dc_kernel_package" "${dc_kernel_package/linux-image-/linux-modules-extra-}" cpio dosfstools parted zstd
      - name: Retain OVMF test firmware
        run: |
          mkdir -p out/firmware
          cp /usr/share/OVMF/OVMF_CODE_4M.secboot.fd /usr/share/OVMF/OVMF_VARS_4M.ms.fd /usr/share/OVMF/OVMF_VARS_4M.fd out/firmware/
          cp /usr/share/doc/ovmf/copyright out/firmware/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: OVMF-test-firmware
          path: out/firmware/
      - name: Boot reference hybrid Linux in BIOS and UEFI
        run: python3 tests/vm/boot_linux.py
      - name: Repair GRUB and boot the repaired disk in BIOS and UEFI
        run: sudo python3 tests/vm/repair_boot.py
      - name: Build restricted direct AHCI adapter
        run: |
          sudo apt-get install -y libgtk-3-dev libusb-dev libconfig-dev gettext xxd pkg-config
          python3 scripts/qualify_opensuperclone.py --direct --output out/osc-direct
      - name: Read isolated AHCI source with DMA and resume in QEMU
        run: sudo python3 tests/vm/direct_ahci.py
      - name: Upload direct engine and corresponding GPL sources
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Direct-AHCI-0.7.0
          path: |
            scripts/direct_rescue.py
            scripts/relay_power.py
            docs/DIRECT-AHCI-AR.md
            out/osc-direct/build/src/opensuperclone/opensuperclone
            out/osc-direct/qualification.json
            out/osc-direct/adapter.patch
            out/osc-direct/upstream-source.tar.gz
            out/osc-direct/LICENSE
            out/direct-vm/results.json
          if-no-files-found: error
      - name: Upload VM proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-DC-VM-0.7.0
          path: |
            out/vm/*.png
            out/vm/*.ppm
            out/vm/*.txt
            out/vm/*.json
            out/boot-repair-vm/*.txt
            out/boot-repair-vm/results.json
            out/direct-vm/serial.txt
            out/direct-vm/results.json
          if-no-files-found: warn

  windows-vm:
    if: ${{ always() && needs.linux-vm.result != 'cancelled' }}
    needs: linux-vm
    runs-on: windows-2022
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        mode: [bios, uefi, secureboot]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OVMF-test-firmware
          path: out/firmware
      - name: Install QEMU
        shell: pwsh
        run: choco install qemu -y --no-progress
      - name: Boot installed evaluation Windows and inspect guest Secure Boot
        shell: pwsh
        run: ./tests/vm/windows_boot.ps1 -Mode ${{ matrix.mode }}
      - name: Collect failed VM preparation diagnostics
        if: always()
        shell: pwsh
        run: |
          $mode='${{ matrix.mode }}'
          $source=Join-Path $env:RUNNER_TEMP ('dc-windows-'+$mode)
          New-Item -ItemType Directory -Force "out/windows-vm-$mode" | Out-Null
          if(Test-Path $source){Copy-Item "$source/*.log","$source/*.txt","$source/*.json" "out/windows-vm-$mode" -ErrorAction SilentlyContinue}
      - name: Retain Windows VM proof without Microsoft images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-Windows-VM-${{ matrix.mode }}-0.7.0
          path: out/windows-vm-${{ matrix.mode }}/
          if-no-files-found: warn

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, linux-vm, windows-vm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NEXVARY-DC-Release-0.7.0
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: NEXVARY-Direct-AHCI-0.7.0
          path: direct-engine
      - uses: actions/download-artifact@v4
        with:
          pattern: NEXVARY-Windows-VM-*-0.7.0
          path: windows-proof
      - name: Package qualified Linux helper and corresponding sources
        run: tar -czf release/NEXVARY-DC-0.7.0-Linux-Direct-AHCI.tar.gz -C direct-engine .
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYVERIFY'
          import json, os, pathlib, hashlib
          data=json.loads(pathlib.Path('release/release-manifest.json').read_text(encoding='utf-8-sig'))
          assert data['commit']==os.environ['GITHUB_SHA']
          direct=json.loads(pathlib.Path('direct-engine/out/direct-vm/results.json').read_text())
          assert direct['sourceUnchanged'] and not direct['sourceWritesObserved'] and direct['cancelResumeTested'] and direct['sourceIdentityRejected']
          windows={}
          for p in pathlib.Path('windows-proof').glob('*/result.json'):
              row=json.loads(p.read_text(encoding='utf-8-sig'))
              assert row['installedWindowsBoot'] and row['secureBoot']==(row['mode']=='secureboot')
              assert row['dcUSBPreparationTested'] and row['usbWindowsPEBoot'] and row['systemDiskRefused'] and row['changedIdentityRefused'] and row['insufficientSpaceRefused']
              windows[row['mode']]=row
          assert set(windows)=={'bios','uefi','secureboot'}
          data['verification']={'directAHCIVM':direct,'installedWindowsVM':windows,'dcWindowsUSBEndToEndTested':True,'firmwareRepairCertifiedFamilies':0}

          p=pathlib.Path('release/NEXVARY-DC-0.7.0-Linux-Direct-AHCI.tar.gz')
          data['files'].append({'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          pathlib.Path('release/release-manifest.json').write_text(json.dumps(data,indent=2))
          for row in data['files']:
              p=pathlib.Path('release')/row['name']
              assert p.stat().st_size==row['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
          PYVERIFY
          gh release create v0.7.0 release/* --target "$GITHUB_SHA" --title 'NEXVARY Disk Care 0.7.0' --notes-file docs/RELEASE-0.7.0.md

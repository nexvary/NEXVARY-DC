name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: disk-care-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cancel-stale:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const current = Number(process.env.GITHUB_RUN_ID);
            const runs = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, branch, per_page: 30 });
            for (const run of runs.data.workflow_runs) {
              if (run.id < current && run.name === 'Build and verify' && run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Test portable deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $savedPath = $env:PATH
          $savedPlugins = $env:QT_PLUGIN_PATH
          $savedImports = $env:QML2_IMPORT_PATH
          try {
            $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot;$env:SystemRoot/System32/WindowsPowerShell/v1.0"
            $env:QT_PLUGIN_PATH = ""
            $env:QML2_IMPORT_PATH = ""
            $env:QT_QPA_PLATFORM = "offscreen"
            $env:QT_QUICK_BACKEND = "software"
            $exe = (Resolve-Path out/portable/nexvary_dc.exe).Path
            $proc = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (!$proc.WaitForExit(45000)) { $proc.Kill(); throw "Portable startup timed out" }
            if ($proc.ExitCode -ne 0) { throw "Portable startup failed: $($proc.ExitCode)" }
          } finally {
            $env:PATH = $savedPath
            $env:QT_PLUGIN_PATH = $savedPlugins
            $env:QML2_IMPORT_PATH = $savedImports
          }
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler unavailable" }
          & $compiler packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Upload installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-DC-Installer-0.1.0
          path: out/NEXVARY-DC-0.1.0-Setup.exe
          if-no-files-found: error
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-DC-Portable-0.1.0
          path: out/portable/
          if-no-files-found: error
